name: credit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      # Local default, so a clean clone starts without a .env file. The database is only
      # used inside this Compose project. Set POSTGRES_PASSWORD in .env to change it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      POSTGRES_DB: ${POSTGRES_DB:-credit}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 30

  extraction:
    build: extraction_service
    environment:
      MODEL_B_CHECKPOINT: ${MODEL_B_CHECKPOINT:-impira/layoutlm-document-qa}
      MODEL_B_REVISION: ${MODEL_B_REVISION:-beed3c4d02d86017ebca5bd0fdf210046b907aa6}
    volumes:
      - models:/models
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      start_period: 600s
      retries: 30

  ollama:
    image: ollama/ollama:0.32.5
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10

  # Downloads Model C once, then stops. It replaces the manual `ollama pull` step.
  # The model stays in the ollama volume, so later starts finish at once.
  ollama-pull:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${MODEL_C:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@postgres:5432/${POSTGRES_DB:-credit}}
      EXTRACTION_URL: http://extraction:8000
      OLLAMA_URL: http://ollama:11434
      MODEL_A: ${MODEL_A:-}
      MODEL_C: ${MODEL_C:-llama3.2:3b}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      extraction:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    build: frontend
    environment:
      BACKEND_URL: http://backend:8000
      # Measured on 2026-11-20 (see "Measured times" in docs/page_spec.md): extraction at most
      # 18.9 s, decision at most about 60 s. The page waits longer than the backend: 180 s for
      # the extraction plus 20 s, and 60 s for Model C plus 30 s.
      EXTRACTION_TIMEOUT_SECONDS: "200"
      DECISION_TIMEOUT_SECONDS: "90"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  postgres:
  models:
  ollama:
