[project]
name = "credit-backend"
version = "0.1.0"
requires-python = ">=3.13"
# Task 1: the packages your service needs to run.
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

# Task 3: the settings of your tools.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
