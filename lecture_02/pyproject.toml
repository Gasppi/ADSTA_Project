[project]
name = "credit-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "ipykernel>=7.4.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.build-backend]
module-name = ["credit_backend", "credit_training"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]

[tool.ty.src]
exclude = ["extraction_service"]
