[project]
name = "credit-extraction"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141",
    "pydantic-settings>=2.15",
    "pdfplumber>=0.11",
    # cryptography 47 crashes while it is imported on ARM64 under Docker Desktop.
    # pdfplumber brings it in, so the last release that works is named here.
    "cryptography>=36,<47",
    "transformers>=5.16,<6",
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "reportlab>=5.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit_extraction"

# The default torch wheel for Linux carries the CUDA runtime, which is gigabytes the
# container never uses. The marker keeps the CPU index to Linux, which is the container.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["tests"]
